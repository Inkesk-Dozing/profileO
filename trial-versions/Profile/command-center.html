<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center - Supreme Creator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 2s;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .loading-text {
            font-size: 2em;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        .cosmos {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #000 0%, #001122 50%, #000 100%);
            position: relative;
            perspective: 1000px;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }
        .cursor-mannequin {
            position: absolute;
            width: 50px;
            height: 100px;
            background: linear-gradient(45deg, #0f0, #00f);
            border: 1px solid #0f0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform 0.1s;
            z-index: 10;
        }
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 15, 0, 0.8);
            border: 1px solid #0f0;
            padding: 20px;
            font-size: 1.2em;
        }
        .control-panel h3 {
            margin: 0 0 10px 0;
            color: #0f0;
        }
        .control-panel p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">Calibrating Star-Chart...</div>
    </div>
    <div class="cosmos" id="cosmos">
        <div class="cursor-mannequin" id="cursor"></div>
        <div class="control-panel">
            <h3>Command Center</h3>
            <p>Navigate the Cosmos</p>
            <p>Status: Supreme Authority Active</p>
            <p>Projects: Infinite</p>
        </div>
    </div>
    <script>
        // Loading sequence
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 3000);

        // Generate stars
        const cosmos = document.getElementById('cosmos');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            cosmos.appendChild(star);
        }

        // Cursor mannequin
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
