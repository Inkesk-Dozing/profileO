<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline of Power - Supreme Creator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
            font-family: 'Times New Roman', serif;
            overflow-x: hidden;
        }
        .landing {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
        }
        .epitome {
            font-size: 10em;
            font-weight: bold;
            color: #000;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .mannequin {
            position: absolute;
            width: 200px;
            height: 400px;
            background: linear-gradient(45deg, #000, #fff);
            border: 2px solid #000;
            transform: translateX(-100%);
            transition: transform 2s ease;
        }
        .mannequin.active {
            transform: translateX(0);
        }
        .phase {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .sketch {
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="0" y1="50" x2="100" y2="50" stroke="%23000" stroke-width="1"/><line x1="50" y1="0" x2="50" y2="100" stroke="%23000" stroke-width="1"/></svg>') repeat;
            filter: grayscale(100%);
        }
        .realized {
            background: linear-gradient(45deg, #ff4500, #000);
            color: #fff;
        }
        .text-layer {
            position: absolute;
            font-size: 3em;
            z-index: 5;
        }
        .text-layer.front { z-index: 15; }
        .text-layer.back { z-index: 5; opacity: 0.5; }
        .chapter h2 {
            font-size: 4em;
            margin: 0;
        }
        .chapter p {
            font-size: 1.5em;
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>
    <section class="landing">
        <div class="epitome">THE EPITOME</div>
    </section>
    <section class="phase sketch">
        <div class="mannequin" id="mannequin"></div>
        <div class="text-layer back">Planning Phase</div>
        <div class="chapter">
            <h2>The Sketch</h2>
            <p>From humble beginnings, I sketched the blueprints of innovation.</p>
        </div>
    </section>
    <section class="phase realized">
        <div class="text-layer front">Authority Phase</div>
        <div class="chapter">
            <h2>The Realization</h2>
            <p>Now, I command the realms, turning visions into reality.</p>
        </div>
    </section>
    <script>
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            if (scrollY > 100) {
                document.getElementById('mannequin').classList.add('active');
            }
        });
    </script>
</body>
</html>
