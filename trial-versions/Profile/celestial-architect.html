<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Architect - Supreme Creator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            perspective: 1000px;
        }
        .scene {
            height: 100vh;
            position: relative;
            transform-style: preserve-3d;
        }
        .mannequin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 400px;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(0,255,255,0.1));
            border: 2px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,255,255,0.5);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-20px); }
        }
        .galaxy {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff4500, #000);
            border-radius: 50%;
            opacity: 0;
            transition: all 2s ease;
        }
        .galaxy.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .planets {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .planet {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #888);
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .planet:nth-child(1) { width: 50px; height: 50px; top: 20%; left: 20%; animation: orbit 10s linear infinite; }
        .planet:nth-child(2) { width: 70px; height: 70px; top: 30%; right: 20%; animation: orbit 15s linear infinite reverse; }
        .planet:nth-child(3) { width: 40px; height: 40px; bottom: 20%; left: 30%; animation: orbit 12s linear infinite; }
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
        }
        .chapter {
            position: absolute;
            opacity: 0;
            transition: opacity 1s;
        }
        .chapter.active { opacity: 1; }
        .chapter h2 {
            font-size: 2em;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        .chapter p {
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="mannequin" id="mannequin"></div>
        <div class="galaxy" id="galaxy">
            <div class="planets">
                <div class="planet"></div>
                <div class="planet"></div>
                <div class="planet"></div>
            </div>
        </div>
        <div class="chapter" id="genesis">
            <h2>The Genesis</h2>
            <p>Born from the void, I am the Celestial Architect, designing universes with code and creativity.</p>
        </div>
        <div class="chapter" id="supernova">
            <h2>The Supernova</h2>
            <p>My biggest project: A revolutionary AI that reshapes reality.</p>
        </div>
    </div>
    <script>
        let scrollY = 0;
        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
            if (scrollY > 200) {
                document.getElementById('galaxy').classList.add('active');
                document.getElementById('genesis').classList.add('active');
            }
            if (scrollY > 600) {
                document.getElementById('supernova').classList.add('active');
            }
        });
    </script>
</body>
</html>
